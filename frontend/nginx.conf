server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 8k;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://images-assets.nasa.gov; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    location /api/ {
        access_log off;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 20s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
